<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life - Modern Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #2d3436;
            --light: #f5f6fa;
            --success: #00b894;
            --danger: #d63031;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark), #1e272e);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(30, 47, 58, 0.9);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .header {
            padding: 30px;
            text-align: center;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .controls {
            padding: 25px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #5649c0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #8a7df8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(162, 155, 254, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c92a2a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
        }

        .speed-control input {
            width: 120px;
            cursor: pointer;
        }

        .game-area {
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(45deg, #1a2233, #2d3c5b);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .status-bar {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .status-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .status-bar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cube"></i> Conway's Game of Life</h1>
            <p>Experience the beauty of cellular automata with modern visuals</p>
        </div>

        <div class="controls">
            <button id="start" class="btn btn-primary"><i class="fas fa-play"></i> Start</button>
            <button id="stop" class="btn btn-secondary"><i class="fas fa-pause"></i> Stop</button>
            <button id="clear" class="btn btn-danger"><i class="fas fa-trash"></i> Clear</button>
            <button id="randomize" class="btn btn-primary"><i class="fas fa-random"></i> Randomize</button>

            <div class="speed-control">
                <span><i class="fas fa-tachometer-alt"></i> Speed:</span>
                <input type="range" id="speed" min="1" max="20" value="5">
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="particles" id="particles"></div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-icon">G</div>
                <span>Generation: <span id="generation">0</span></span>
            </div>
            <div class="status-item">
                <div class="status-icon">⚡</div>
                <span>Live Cells: <span id="liveCells">0</span></span>
            </div>
            <div class="status-item">
                <div class="status-icon">🎨</div>
                <span>Theme: <select id="theme" style="background: transparent; color: white; border: 1px solid var(--primary); padding: 5px;">
                    <option value="classic">Classic</option>
                    <option value="neon">Neon</option>
                    <option value="fire">Fire</option>
                </select></span>
            </div>
        </div>
    </div>

    <script>
        // Game of Life implementation
        class GameOfLife {
            constructor(canvasId, cellSize = 10) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.cellSize = cellSize;
                this.gridWidth = Math.floor(this.canvas.width / cellSize);
                this.gridHeight = Math.floor(this.canvas.height / cellSize);
                this.grid = this.createEmptyGrid();
                this.nextGrid = this.createEmptyGrid();
                this.generation = 0;
                this.liveCells = 0;
                this.isRunning = false;
                this.animationId = null;
                this.speed = 5;
                this.theme = 'classic';
                this.particles = [];

                // Initialize canvas
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Set up event listeners
                this.setupEventListeners();

                // Start particle system
                this.initParticles();
            }

            createEmptyGrid() {
                return Array(this.gridHeight).fill().map(() =>
                    Array(this.gridWidth).fill(0)
                );
            }

            resizeCanvas() {
                const container = document.querySelector('.game-area');
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight - 2; // Account for border
                this.gridWidth = Math.floor(this.canvas.width / this.cellSize);
                this.gridHeight = Math.floor(this.canvas.height / this.cellSize);
                this.grid = this.createEmptyGrid();
                this.nextGrid = this.createEmptyGrid();
            }

            setupEventListeners() {
                document.getElementById('start').addEventListener('click', () => this.start());
                document.getElementById('stop').addEventListener('click', () => this.stop());
                document.getElementById('clear').addEventListener('click', () => this.clear());
                document.getElementById('randomize').addEventListener('click', () => this.randomize());

                document.getElementById('speed').addEventListener('input', (e) => {
                    this.speed = parseInt(e.target.value);
                });

                document.getElementById('theme').addEventListener('change', (e) => {
                    this.theme = e.target.value;
                });

                // Canvas interaction
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                document.addEventListener('mouseup', () => this.isDrawing = false);
            }

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.cellSize);
                const y = Math.floor((e.clientY - rect.top) / this.cellSize);

                if (x >= 0 && x < this.gridWidth && y >= 0 && y < this.gridHeight) {
                    this.toggleCell(x, y);
                    this.isDrawing = true;
                }
            }

            handleMouseMove(e) {
                if (!this.isDrawing) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.cellSize);
                const y = Math.floor((e.clientY - rect.top) / this.cellSize);

                if (x >= 0 && x < this.gridWidth && y >= 0 && y < this.gridHeight) {
                    this.toggleCell(x, y);
                }
            }

            toggleCell(x, y) {
                this.grid[y][x] = this.grid[y][x] ? 0 : 1;
                this.updateLiveCells();
                this.drawGrid();
            }

            start() {
                if (this.isRunning) return;
                this.isRunning = true;
                this.lastTime = performance.now();
                this.gameLoop();
            }

            stop() {
                this.isRunning = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }

            clear() {
                this.grid = this.createEmptyGrid();
                this.nextGrid = this.createEmptyGrid();
                this.generation = 0;
                this.liveCells = 0;
                this.drawGrid();
                this.updateStatus();
            }

            randomize() {
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        this.grid[y][x] = Math.random() > 0.7 ? 1 : 0;
                    }
                }
                this.updateLiveCells();
                this.drawGrid();
            }

            gameLoop(currentTime = 0) {
                if (!this.isRunning) return;

                const deltaTime = currentTime - (this.lastTime || currentTime);
                const speedFactor = Math.max(1, this.speed);

                // Only update at the desired speed
                if (deltaTime >= 1000 / speedFactor) {
                    this.update();
                    this.lastTime = currentTime;
                }

                this.draw();
                this.animationId = requestAnimationFrame((time) => this.gameLoop(time));
            }

            update() {
                // Count live neighbors for each cell
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        let neighbors = 0;

                        // Check all 8 surrounding cells
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;

                                const nx = x + dx;
                                const ny = y + dy;

                                // Wrap around edges
                                const checkX = ((nx % this.gridWidth) + this.gridWidth) % this.gridWidth;
                                const checkY = ((ny % this.gridHeight) + this.gridHeight) % this.gridHeight;

                                neighbors += this.grid[checkY][checkX];
                            }
                        }

                        // Apply rules
                        if (this.grid[y][x]) {
                            // Any live cell with 2 or 3 live neighbors survives
                            this.nextGrid[y][x] = neighbors === 2 || neighbors === 3 ? 1 : 0;
                        } else {
                            // Any dead cell with exactly 3 live neighbors becomes a live cell
                            this.nextGrid[y][x] = neighbors === 3 ? 1 : 0;
                        }
                    }
                }

                // Swap grids
                [this.grid, this.nextGrid] = [this.nextGrid, this.grid];
                this.generation++;
                this.updateLiveCells();
            }

            draw() {
                this.drawGrid();
                this.updateParticles();
                this.drawParticles();
            }

            drawGrid() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid lines (optional)
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 0.5;
                for (let i = 0; i < this.gridWidth; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.cellSize, 0);
                    this.ctx.lineTo(i * this.cellSize, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let j = 0; j < this.gridHeight; j++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, j * this.cellSize);
                    this.ctx.lineTo(this.canvas.width, j * this.cellSize);
                    this.ctx.stroke();
                }

                // Draw cells
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        if (this.grid[y][x]) {
                            const color = this.getCellColor(x, y);
                            this.ctx.fillStyle = color;
                            this.ctx.fillRect(
                                x * this.cellSize,
                                y * this.cellSize,
                                this.cellSize,
                                this.cellSize
                            );
                        }
                    }
                }
            }

            getCellColor(x, y) {
                switch (this.theme) {
                    case 'neon':
                        const hue = (x + y * 10) * 3;
                        return `hsl(${hue}, 100%, 50%)`;
                    case 'fire':
                        const brightness = Math.min(100, (x + y * 2) * 2);
                        return `hsl(0, 100%, ${brightness}%)`;
                    default: // classic
                        return '#4CAF50';
                }
            }

            updateLiveCells() {
                this.liveCells = 0;
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        if (this.grid[y][x]) this.liveCells++;
                    }
                }
            }

            updateStatus() {
                document.getElementById('generation').textContent = this.generation;
                document.getElementById('liveCells').textContent = this.liveCells;
            }

            // Particle system for visual effects
            initParticles() {
                const particleCount = 50;
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 3 + 1,
                        speedX: Math.random() * 2 - 1,
                        speedY: Math.random() * 2 - 1,
                        color: `hsl(${Math.random() * 60 + 200}, 100%, 50%)`
                    });
                }
            }

            updateParticles() {
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];

                    // Move particle
                    p.x += p.speedX;
                    p.y += p.speedY;

                    // Bounce off walls
                    if (p.x < 0 || p.x > this.canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.speedY *= -1;

                    // Occasionally create new particles near live cells
                    if (Math.random() < 0.02 && this.liveCells > 0) {
                        const liveCell = this.getRandomLiveCell();
                        if (liveCell) {
                            p.x = liveCell.x * this.cellSize + Math.random() * this.cellSize;
                            p.y = liveCell.y * this.cellSize + Math.random() * this.cellSize;
                            p.size = Math.random() * 3 + 1;
                            p.speedX = Math.random() * 2 - 1;
                            p.speedY = Math.random() * 2 - 1;
                        }
                    }
                }
            }

            getRandomLiveCell() {
                const liveCells = [];
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        if (this.grid[y][x]) {
                            liveCells.push({x, y});
                        }
                    }
                }

                return liveCells.length > 0 ?
                    liveCells[Math.floor(Math.random() * liveCells.length)] : null;
            }

            drawParticles() {
                this.ctx.globalAlpha = 0.7;
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1;
            }
        }

        // Initialize the game when the page loads
        window.addEventListener('load', () => {
            const game = new GameOfLife('gameCanvas');
            game.updateStatus();

            // Start with a random pattern
            setTimeout(() => {
                if (!game.isRunning) {
                    game.randomize();
                }
            }, 1000);
        });
    </script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
        }

        .game-area {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
        }

        canvas {
            display: block;
            background: #111;
        }

        button {
            background: linear-gradient(45deg, #6e8efb, #a777e3);
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(45deg, #6e8efb, #a777e3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
    </style>
</body>
</html>
