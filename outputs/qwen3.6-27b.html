<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 20px;
    font-size: 1.8rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #00d4ff, #7b2fff, #ff2d95);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stats {
    display: flex;
    gap: 30px;
    margin: 10px 0;
    font-size: 0.85rem;
    color: #888;
    letter-spacing: 1px;
  }

  .stats span {
    color: #00d4ff;
    font-weight: 600;
  }

  canvas {
    border: 1px solid #1a1a3a;
    cursor: crosshair;
    margin: 10px 0;
    background: #050510;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.05);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 10px 0;
    max-width: 700px;
  }

  button {
    background: #12122a;
    color: #ccc;
    border: 1px solid #2a2a4a;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }

  button:hover {
    background: #1a1a3a;
    border-color: #4a4a7a;
    color: #fff;
  }

  button.active {
    background: linear-gradient(135deg, #00d4ff22, #7b2fff22);
    border-color: #00d4ff66;
    color: #00d4ff;
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #12122a;
    border: 1px solid #2a2a4a;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
  }

  .slider-group label { color: #888; white-space: nowrap; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100px;
    height: 4px;
    background: #2a2a4a;
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #00d4ff;
    border-radius: 50%;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: #00d4ff;
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  .patterns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
    max-width: 700px;
  }

  .patterns button {
    font-size: 0.75rem;
    padding: 5px 12px;
    background: #0e0e22;
    border-color: #1e1e3a;
  }

  .section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #555;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h1>Game of Life</h1>

<div class="stats">
  <div>Generation: <span id="genCount">0</span></div>
  <div>Population: <span id="popCount">0</span></div>
  <div>FPS: <span id="fpsCount">0</span></div>
</div>

<canvas id="canvas"></canvas>

<div class="controls">
  <button id="playBtn" onclick="togglePlay()">▶ Play</button>
  <button onclick="step()">⏭ Step</button>
  <button onclick="clearGrid()">✕ Clear</button>
  <button onclick="randomize()">🎲 Random</button>
  <div class="slider-group">
    <label>Speed:</label>
    <input type="range" id="speedSlider" min="1" max="60" value="15">
  </div>
  <div class="slider-group">
    <label>Zoom:</label>
    <input type="range" id="zoomSlider" min="3" max="20" value="8">
  </div>
</div>

<div class="section-label">Patterns — click to place at center</div>
<div class="patterns">
  <button onclick="placePattern('glider')">Glider</button>
  <button onclick="placePattern('lwss')">LWSS</button>
  <button onclick="placePattern('pulsar')">Pulsar</button>
  <button onclick="placePattern('pentadecathlon')">Pentadecathlon</button>
  <button onclick="placePattern('gosperGun')">Gosper Gun</button>
  <button onclick="placePattern('acorn')">Acorn</button>
  <button onclick="placePattern('rPentomino')">R-Pentomino</button>
  <button onclick="placePattern('diehard')">Diehard</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let cellSize = 8;
let cols, rows;
let grid, nextGrid;
let playing = false;
let generation = 0;
let population = 0;
let animId = null;
let lastTime = 0;
let frameCount = 0;
let fpsTime = 0;
let currentFps = 0;
let mouseDown = false;
let paintMode = null; // true = draw alive, false = draw dead

function initCanvas() {
  const maxW = Math.min(window.innerWidth - 20, 900);
  const maxH = Math.min(window.innerHeight - 300, 600);
  cols = Math.floor(maxW / cellSize);
  rows = Math.floor(maxH / cellSize);
  canvas.width = cols * cellSize;
  canvas.height = rows * cellSize;
}

function createGrid() {
  return new Uint8Array(cols * rows);
}

function idx(x, y) { return y * cols + x; }

function init() {
  initCanvas();
  grid = createGrid();
  nextGrid = createGrid();
  generation = 0;
  population = 0;
  updateStats();
  draw();
}

function countNeighbors(x, y) {
  let count = 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = (x + dx + cols) % cols;
      const ny = (y + dy + rows) % rows;
      count += grid[idx(nx, ny)];
    }
  }
  return count;
}

function step() {
  population = 0;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      const n = countNeighbors(x, y);
      const alive = grid[i];
      if (alive) {
        nextGrid[i] = (n === 2 || n === 3) ? 1 : 0;
      } else {
        nextGrid[i] = (n === 3) ? 1 : 0;
      }
      population += nextGrid[i];
    }
  }
  [grid, nextGrid] = [nextGrid, grid];
  generation++;
  updateStats();
}

function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw alive cells with glow effect
  const pad = cellSize > 4 ? 0.5 : 0;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[idx(x, y)]) {
        // Color based on neighbor count for visual interest
        const n = countNeighbors(x, y);
        if (n <= 1) ctx.fillStyle = '#ff2d95';
        else if (n === 2) ctx.fillStyle = '#00d4ff';
        else if (n === 3) ctx.fillStyle = '#7b2fff';
        else ctx.fillStyle = '#ff6b35';

        ctx.fillRect(x * cellSize + pad, y * cellSize + pad, cellSize - pad * 2, cellSize - pad * 2);
      }
    }
  }

  // Grid lines (only at higher zoom)
  if (cellSize >= 6) {
    ctx.strokeStyle = '#0f0f25';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= cols; x++) {
      ctx.beginPath();
      ctx.moveTo(x * cellSize, 0);
      ctx.lineTo(x * cellSize, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= rows; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * cellSize);
      ctx.lineTo(canvas.width, y * cellSize);
      ctx.stroke();
    }
  }
}

function gameLoop(timestamp) {
  if (!playing) return;

  const speed = parseInt(document.getElementById('speedSlider').value);
  const interval = 1000 / speed;

  if (timestamp - lastTime >= interval) {
    step();
    draw();
    lastTime = timestamp;
  }

  // FPS counter
  frameCount++;
  if (timestamp - fpsTime >= 1000) {
    currentFps = frameCount;
    frameCount = 0;
    fpsTime = timestamp;
    document.getElementById('fpsCount').textContent = currentFps;
  }

  animId = requestAnimationFrame(gameLoop);
}

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('playBtn');
  if (playing) {
    btn.textContent = '⏸ Pause';
    btn.classList.add('active');
    lastTime = performance.now();
    fpsTime = lastTime;
    frameCount = 0;
    animId = requestAnimationFrame(gameLoop);
  } else {
    btn.textContent = '▶ Play';
    btn.classList.remove('active');
    if (animId) cancelAnimationFrame(animId);
  }
}

function clearGrid() {
  grid.fill(0);
  generation = 0;
  population = 0;
  updateStats();
  draw();
}

function randomize() {
  population = 0;
  for (let i = 0; i < grid.length; i++) {
    grid[i] = Math.random() < 0.25 ? 1 : 0;
    population += grid[i];
  }
  generation = 0;
  updateStats();
  draw();
}

function updateStats() {
  document.getElementById('genCount').textContent = generation;
  document.getElementById('popCount').textContent = population;
}

// Mouse interaction
function getCellFromMouse(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / cellSize);
  const y = Math.floor((e.clientY - rect.top) / cellSize);
  if (x >= 0 && x < cols && y >= 0 && y < rows) return { x, y };
  return null;
}

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  mouseDown = true;
  const cell = getCellFromMouse(e);
  if (cell) {
    paintMode = !grid[idx(cell.x, cell.y)];
    grid[idx(cell.x, cell.y)] = paintMode ? 1 : 0;
    recalcPopulation();
    draw();
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown) return;
  const cell = getCellFromMouse(e);
  if (cell) {
    grid[idx(cell.x, cell.y)] = paintMode ? 1 : 0;
    recalcPopulation();
    draw();
  }
});

window.addEventListener('mouseup', () => { mouseDown = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const cell = getCellFromMouse(touch);
  if (cell) {
    mouseDown = true;
    paintMode = !grid[idx(cell.x, cell.y)];
    grid[idx(cell.x, cell.y)] = paintMode ? 1 : 0;
    recalcPopulation();
    draw();
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!mouseDown) return;
  const touch = e.touches[0];
  const cell = getCellFromMouse(touch);
  if (cell) {
    grid[idx(cell.x, cell.y)] = paintMode ? 1 : 0;
    recalcPopulation();
    draw();
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { mouseDown = false; });

function recalcPopulation() {
  population = 0;
  for (let i = 0; i < grid.length; i++) population += grid[i];
  updateStats();
}

// Zoom slider
document.getElementById('zoomSlider').addEventListener('input', function () {
  const oldGrid = grid;
  const oldCols = cols;
  const oldRows = rows;
  cellSize = parseInt(this.value);
  initCanvas();
  grid = createGrid();
  nextGrid = createGrid();

  // Copy what fits
  const minCols = Math.min(oldCols, cols);
  const minRows = Math.min(oldRows, rows);
  for (let y = 0; y < minRows; y++) {
    for (let x = 0; x < minCols; x++) {
      grid[idx(x, y)] = oldGrid[y * oldCols + x];
    }
  }

  recalcPopulation();
  draw();
});

// Patterns
const patterns = {
  glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
  lwss: [[0,1],[0,3],[1,4],[2,0],[2,4],[3,1],[3,2],[3,3],[3,4]],
  pulsar: (function() {
    const p = [];
    const offsets = [
      [2,0],[3,0],[4,0],[8,0],[9,0],[10,0],
      [0,2],[5,2],[7,2],[12,2],
      [0,3],[5,3],[7,3],[12,3],
      [0,4],[5,4],[7,4],[12,4],
      [2,5],[3,5],[4,5],[8,5],[9,5],[10,5],
    ];
    offsets.forEach(([x,y]) => {
      p.push([x,y]);
      p.push([x,12-y]);
    });
    return [...new Set(p.map(a=>a.join(',')))].map(s=>s.split(',').map(Number));
  })(),
  pentadecathlon: [[0,0],[1,0],[2,-1],[2,1],[3,0],[4,0],[5,0],[6,0],[7,-1],[7,1],[8,0],[9,0]],
  gosperGun: [
    [0,4],[0,5],[1,4],[1,5],
    [10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],
    [14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],
    [20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],
    [24,0],[24,1],[24,5],[24,6],
    [34,2],[34,3],[35,2],[35,3]
  ],
  acorn: [[0,0],[1,0],[1,2],[3,1],[4,0],[5,0],[6,0]],
  rPentomino: [[1,0],[2,0],[0,1],[1,1],[1,2]],
  diehard: [[6,0],[0,1],[1,1],[1,2],[5,2],[6,2],[7,2]]
};

function placePattern(name) {
  const p = patterns[name];
  if (!p) return;

  // Find bounding box
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  p.forEach(([x,y]) => {
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
  });

  const cx = Math.floor(cols / 2) - Math.floor((maxX - minX) / 2);
  const cy = Math.floor(rows / 2) - Math.floor((maxY - minY) / 2);

  p.forEach(([x, y]) => {
    const nx = cx + x;
    const ny = cy + y;
    if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
      grid[idx(nx, ny)] = 1;
    }
  });

  recalcPopulation();
  draw();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyN' || e.code === 'ArrowRight') { step(); draw(); }
  else if (e.code === 'KeyC') { clearGrid(); }
  else if (e.code === 'KeyR') { randomize(); }
});

// Init
init();
</script>

</body>
</html>
