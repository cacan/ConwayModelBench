<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Game of Life</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --primary: #8b5cf6; /* Violet */
            --accent: #06b6d4;  /* Cyan */
            --alive-glow: #22d3ee;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: pulseBg 10s infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, var(--accent), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -2px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1rem;
        }

        /* Controls Container */
        .controls-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            z-index: 10;
        }

        button {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        button.primary-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        button.primary-btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            background: var(--bg-panel);
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-item span {
            color: var(--accent);
            font-weight: bold;
            margin-left: 5px;
        }

        /* The Grid */
        #grid {
            display: grid;
            gap: 1px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 95vw;
            max-height: 70vh;
            overflow: hidden;
        }

        .cell {
            width: 14px; /* Smaller cells for density */
            height: 14px;
            background-color: rgba(255,255,255,0.03);
            border-radius: 2px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .cell.alive {
            background-color: var(--alive-glow);
            box-shadow: 0 0 15px var(--alive-glow), inset 0 0 8px rgba(255,255,255,0.5);
            border-radius: 4px; /* Slightly rounder when alive */
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .controls-container { flex-wrap: wrap; justify-content: center; }
            button { padding: 10px 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>G.O.L.</h1>
        <div class="subtitle">Conway's Game of Life // Interactive Simulation</div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">Gen: <span id="gen-count">0</span></div>
        <div class="stat-item">Alive: <span id="alive-count">0</span></div>
    </div>

    <div class="controls-container">
        <button id="btn-start" class="primary-btn" onclick="toggleGame()">Start Simulation</button>
        <button onclick="randomizeGrid()">Randomize</button>
        <button onclick="clearGrid()">Clear All</button>
    </div>

    <div id="grid"></div>

    <script>
        // --- Configuration ---
        const width = 80;   // Increased density
        const height = 50;  
        let grid = [];      
        let isRunning = false;
        let generation = 0;
        let intervalId = null;

        // --- DOM Elements ---
        const gridElement = document.getElementById('grid');
        const genDisplay = document.getElementById('gen-count');
        const aliveDisplay = document.getElementById('alive-count');
        const startBtn = document.getElementById('btn-start');

        // --- Initialization ---
        function init() {
            createGrid();
            randomizeGrid();
            
            gridElement.addEventListener('click', handleCellClick);
        }

        function createGrid() {
            gridElement.style.gridTemplateColumns = `repeat(${width}, 14px)`;
            
            for (let i = 0; i < width * height; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i; 
                gridElement.appendChild(cell);
            }
        }

        // --- Game Logic ---

        function randomizeGrid() {
            const cells = document.querySelectorAll('.cell');
            grid = [];
            
            for (let i = 0; i < width * height; i++) {
                // 20% chance of being alive initially for a better look
                const state = Math.random() > 0.8 ? 1 : 0; 
                
                cells[i].classList.toggle('alive', state === 1);
                grid.push(state);
            }
            
            generation = 0;
            updateStats();
        }

        function clearGrid() {
            stopGame();
            const cells = document.querySelectorAll('.cell');
            grid = [];
            
            for (let i = 0; i < width * height; i++) {
                cells[i].classList.remove('alive');
                grid.push(0);
            }
            
            generation = 0;
            updateStats();
        }

        function toggleGame() {
            if (isRunning) {
                stopGame();
            } else {
                startGame();
            }
        }

        function startGame() {
            isRunning = true;
            startBtn.textContent = "Pause";
            startBtn.classList.add('active');
            
            // Speed: 50ms for fast action, 100ms for standard
            intervalId = setInterval(updateGrid, 60); 
        }

        function stopGame() {
            isRunning = false;
            startBtn.textContent = "Start Simulation";
            startBtn.classList.remove('active');
            clearInterval(intervalId);
        }

        // --- The Core Loop ---
        function updateGrid() {
            let nextGen = [...grid]; 
            let aliveCount = 0;

            for (let i = 0; i < width * height; i++) {
                const state = grid[i];
                
                if (state === 1) aliveCount++;

                // Calculate neighbors
                let numNeighbors = countNeighbors(i);

                // Rules of Life
                if (state === 0 && numNeighbors === 3) {
                    nextGen[i] = 1; 
                } else if (state === 1 && (numNeighbors < 2 || numNeighbors > 3)) {
                    nextGen[i] = 0; 
                }
            }

            grid = nextGen;
            
            // Update DOM efficiently
            const cells = document.querySelectorAll('.cell');
            for (let i = 0; i < width * height; i++) {
                if (grid[i]) {
                    cells[i].classList.add('alive');
                } else {
                    cells[i].classList.remove('alive');
                }
            }

            generation++;
            updateStats(aliveCount);
        }

        function countNeighbors(index) {
            let sum = 0;
            const x = Math.floor(index / width);
            const y = index % width;

            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    if (i === 0 && j === 0) continue; 

                    let col = (y + j + width) % width; 
                    let row = (x + i + height) % height;

                    sum += grid[row * width + col];
                }
            }
            return sum;
        }

        function updateStats(count) {
            genDisplay.textContent = generation;
            aliveDisplay.textContent = count;
        }

        // --- Interaction ---
        function handleCellClick(e) {
            const cell = e.target.closest('.cell');
            if (!cell) return;

            const index = parseInt(cell.dataset.index);
            
            grid[index] = grid[index] ? 0 : 1;
            cell.classList.toggle('alive');
        }

        init();
    </script>
</body>
</html>
