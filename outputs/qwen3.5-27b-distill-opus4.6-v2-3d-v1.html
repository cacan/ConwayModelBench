<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberLife 3D // WebGL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050b14;
            font-family: 'Rajdhani', sans-serif;
            color: white;
        }

        /* The Canvas fills the screen */
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }

        /* UI Overlay - HUD Style */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 20, 35, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #00f3ff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 280px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .control-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            font-size: 0.9rem; 
            color: #aaa; 
            margin-bottom: 5px; 
        }

        input[type="number"] {
            width: 60px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: white;
            padding: 5px;
            border-radius: 4px;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }

        button {
            flex: 1;
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            border: none;
            cursor: pointer;
            background: #00f3ff;
            color: #050b14;
            font-weight: bold;
            transition: all 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.2); }
        
        button.secondary { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; }
        button.danger { background: #ff4b1f; color: white; }

        .stats {
            margin-top: 20px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .stat-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .val { color: #fff; font-weight: bold; }

        /* Instructions overlay */
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0.7;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
    
    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <h1>CYBERLIFE 3D</h1>
        
        <div class="control-group">
            <label>Grid Size (Rows x Cols)</label>
            <input type="number" id="inpRows" value="20" min="5" max="60"> 
            <span style="color:#aaa; margin: 0 5px;">x</span>
            <input type="number" id="inpCols" value="30" min="5" max="80">
        </div>

        <div class="control-group">
            <label>Simulation Speed (ms)</label>
            <input type="number" id="inpSpeed" value="100" min="10" max="1000">
        </div>

        <div class="btn-row">
            <button id="btnStart">START</button>
            <button class="secondary" id="btnRand">RANDOM</button>
        </div>
        <div class="btn-row">
             <button class="danger" style="flex:0.5" id="btnClear">CLEAR</button>
             <button class="secondary" style="flex:1.5" onclick="rebuildGrid()">REBUILD GRID</button>
        </div>

        <div class="stats">
            <div class="stat-item"><span>Generation:</span> <span id="dispGen" class="val">0</span></div>
            <div class="stat-item"><span>Population:</span> <span id="dispPop" class="val">0</span></div>
        </div>
    </div>

    <div id="instructions">
        LEFT CLICK: Rotate &bull; RIGHT CLICK: Pan &bull; SCROLL: Zoom &bull; CLICK CUBE: Toggle Life
    </div>

    <!-- Main Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        let rows = 20;
        let cols = 30;
        let speed = 100;
        let isRunning = false;
        let intervalId = null;
        let generation = 0;
        
        // Game State Array (2D)
        let gridData = [];

        // Three.js Globals
        let scene, camera, renderer, controls;
        let instancedMesh; 
        const dummy = new THREE.Object3D(); // Helper for matrix calculations
        
        // Colors
        const colorDead = new THREE.Color(0x2c3e50);
        const colorAlive = new THREE.Color(0x00f3ff);
        const colorHover = new THREE.Color(0xffffff);

        initThreeJS();
        rebuildGrid(); // Initial build

        function initThreeJS() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050b14);
            scene.fog = new THREE.FogExp2(0x050b14, 0.02);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(cols * 1.5, rows * 1.5, cols * 1.5);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Controls (Orbit)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            // Add a point light for glow effect
            const pointLight = new THREE.PointLight(0x00f3ff, 0.8);
            pointLight.position.set(cols/2, rows/2 + 10, cols/2);
            scene.add(pointLight);

            // Animation Loop
            animate();
        }

        function rebuildGrid() {
            // Get inputs
            const rInput = document.getElementById('inpRows').value;
            const cInput = document.getElementById('inpCols').value;
            
            if(rInput > 0 && cInput > 0) {
                rows = parseInt(rInput);
                cols = parseInt(cInput);
            }

            // Stop simulation temporarily
            stopSimulation();

            // Clear old mesh
            if(instancedMesh) {
                scene.remove(instancedMesh);
                instancedMesh.geometry.dispose();
                instancedMesh.material.dispose();
            }

            // 1. Create Logic Grid (2D Array)
            gridData = [];
            for(let r=0; r<rows; r++) {
                let row = [];
                for(let c=0; c<cols; c++) {
                    row.push(0);
                }
                gridData.push(row);
            }

            // 2. Create Visual Grid (InstancedMesh)
            const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const material = new THREE.MeshStandardMaterial({ 
                color: colorDead,
                roughness: 0.4,
                metalness: 0.6
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, rows * cols);
            instancedMesh.castShadow = true;
            instancedMesh.receiveShadow = true;

            let index = 0;
            const offsetX = (cols - 1) / 2;
            const offsetZ = (rows - 1) / 2;

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    dummy.position.set(c - offsetX, 0, r - offsetZ);
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(index++, dummy.matrix);
                }
            }

            scene.add(instancedMesh);
            
            // Reset Camera slightly to fit new grid
            camera.position.set(cols * 1.2, rows * 1.5, cols * 1.2);
            controls.target.set(0,0,0);
            
            updateStats();
        }

        function randomize() {
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    gridData[r][c] = Math.random() > 0.7 ? 1 : 0;
                }
            }
            updateVisuals();
        }

        function clearGrid() {
            stopSimulation();
            generation = 0;
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    gridData[r][c] = 0;
                }
            }
            updateVisuals();
        }

        // --- Game Logic ---

        function nextGen() {
            let nextGrid = gridData.map(arr => [...arr]);
            let population = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const state = gridData[r][c];
                    const neighbors = countNeighbors(gridData, r, c);

                    if (state === 0 && neighbors === 3) nextGrid[r][c] = 1;
                    else if (state === 1 && (neighbors < 2 || neighbors > 3)) nextGrid[r][c] = 0;
                    else nextGrid[r][c] = state;

                    if(nextGrid[r][c] === 1) population++;
                }
            }

            gridData = nextGrid;
            generation++;
            updateVisuals();
            
            // Update DOM Stats
            document.getElementById('dispGen').innerText = generation;
            document.getElementById('dispPop').innerText = population;
        }

        function countNeighbors(grid, r, c) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    // Wrap around edges
                    let x = (r + i + rows) % rows;
                    let y = (c + j + cols) % cols;
                    sum += grid[x][y];
                }
            }
            sum -= grid[r][c]; 
            return sum;
        }

        // --- Rendering Updates ---

        function updateVisuals() {
            if(!instancedMesh) return;

            let index = 0;
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    const state = gridData[r][c];
                    
                    // Set color based on state
                    instancedMesh.setColorAt(index, state === 1 ? colorAlive : colorDead);
                    
                    index++;
                }
            }
            
            instancedMesh.instanceColor.needsUpdate = true;
        }

        function updateStats() {
             document.getElementById('dispGen').innerText = generation;
             let pop = 0;
             gridData.forEach(row => row.forEach(cell => pop += cell));
             document.getElementById('dispPop').innerText = pop;
        }

        // --- Interaction (Raycasting) ---

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', onMouseClick, false);

        function onMouseClick(event) {
            // Don't trigger if clicking UI
            if(event.target.closest('#ui-layer')) return;

            // Calculate mouse position in normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersect against the instanced mesh
            const intersects = raycaster.intersectObject(instancedMesh);

            if (intersects.length > 0) {
                const instanceId = intersects[0].instanceId;
                
                // Convert flat index back to r,c coordinates
                const c = instanceId % cols;
                const r = Math.floor(instanceId / cols);

                // Toggle state
                gridData[r][c] = gridData[r][c] ? 0 : 1;
                
                // Immediate visual update for clicked cell only (optimization)
                instancedMesh.setColorAt(instanceId, gridData[r][c] === 1 ? colorAlive : colorDead);
                instancedMesh.instanceColor.needsUpdate = true;
                
                updateStats();
            }
        }

        // --- Controls Logic ---

        function startSimulation() {
            if(isRunning) return;
            isRunning = true;
            document.getElementById('btnStart').innerText = "PAUSE";
            document.getElementById('btnStart').classList.add('danger');
            
            speed = parseInt(document.getElementById('inpSpeed').value);
            intervalId = setInterval(nextGen, speed);
        }

        function stopSimulation() {
            isRunning = false;
            clearInterval(intervalId);
            document.getElementById('btnStart').innerText = "START";
            document.getElementById('btnStart').classList.remove('danger');
        }

        // --- Event Listeners for UI ---

        document.getElementById('btnStart').addEventListener('click', () => {
            if(isRunning) stopSimulation(); else startSimulation();
        });

        document.getElementById('btnRand').addEventListener('click', randomize);
        document.getElementById('btnClear').addEventListener('click', clearGrid);

        // Handle Window Resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update(); // Required for damping
            
            // Subtle floating animation for the whole grid group (optional aesthetic)
            if(instancedMesh) {
                instancedMesh.position.y = Math.sin(Date.now() * 0.001) * 0.2;
            }

            renderer.render(scene, camera);
        }

        // Expose functions to window for HTML buttons
        window.rebuildGrid = rebuildGrid;
    </script>
</body>
</html>
