<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
            font-size: 2rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .stats {
            margin: 8px 0;
            font-size: 0.9rem;
            color: #888;
            display: flex;
            gap: 24px;
        }

        .stats span {
            color: #00d4ff;
            font-weight: bold;
        }

        canvas {
            border: 1px solid #1a1a3a;
            border-radius: 8px;
            cursor: crosshair;
            background: #0d0d22;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.05);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0;
            max-width: 700px;
        }

        button {
            padding: 10px 22px;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            background: #12122a;
            color: #e0e0e0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #1e1e40;
            border-color: #00d4ff;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        }

        button.active {
            background: linear-gradient(135deg, #00d4ff22, #7b2ff722);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #12122a;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
        }

        .slider-group label {
            font-size: 0.85rem;
            color: #aaa;
            white-space: nowrap;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: #2a2a4a;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
        }

        .patterns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .patterns button {
            font-size: 0.8rem;
            padding: 6px 14px;
            border-color: #3a2a5a;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>Conway's Game of Life</h1>

    <div class="stats">
        <div>Generation: <span id="generation">0</span></div>
        <div>Population: <span id="population">0</span></div>
        <div>Grid: <span id="gridSize"></span></div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button onclick="step()">⏭ Step</button>
        <button onclick="clearGrid()">✕ Clear</button>
        <button onclick="randomize()">🎲 Random</button>

        <div class="slider-group">
            <label>Speed:</label>
            <input type="range" id="speedSlider" min="1" max="60" value="15">
            <span id="speedVal">15</span><span style="color:#555;font-size:0.8rem">fps</span>
        </div>

        <div class="slider-group">
            <label>Cell Size:</label>
            <input type="range" id="sizeSlider" min="4" max="20" value="10">
            <span id="sizeVal">10</span><span style="color:#555;font-size:0.8rem">px</span>
        </div>
    </div>

    <p class="section-label">Patterns</p>
    <div class="patterns">
        <button onclick="placePattern('glider')">Glider</button>
        <button onclick="placePattern('lwss')">LWSS</button>
        <button onclick="placePattern('pulsar')">Pulsar</button>
        <button onclick="placePattern('pentadecathlon')">Pentadecathlon</button>
        <button onclick="placePattern('gosperGun')">Gosper Gun</button>
        <button onclick="placePattern('acorn')">Acorn</button>
        <button onclick="placePattern('rPentomino')">R-Pentomino</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let cellSize = 10;
        let cols, rows;
        let grid, nextGrid;
        let playing = false;
        let generation = 0;
        let lastFrameTime = 0;
        let animationId = null;
        let isDrawing = false;
        let drawValue = 1;

        function initCanvas() {
            const maxW = Math.min(window.innerWidth - 40, 800);
            const maxH = Math.min(window.innerHeight - 320, 600);
            cols = Math.floor(maxW / cellSize);
            rows = Math.floor(maxH / cellSize);
            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;
            document.getElementById('gridSize').textContent = `${cols}×${rows}`;

            const oldGrid = grid;
            const oldCols = oldGrid ? oldGrid[0].length : 0;
            const oldRows = oldGrid ? oldGrid.length : 0;

            grid = Array.from({ length: rows }, () => new Uint8Array(cols));
            nextGrid = Array.from({ length: rows }, () => new Uint8Array(cols));

            if (oldGrid) {
                for (let r = 0; r < Math.min(oldRows, rows); r++) {
                    for (let c = 0; c < Math.min(oldCols, cols); c++) {
                        grid[r][c] = oldGrid[r][c];
                    }
                }
            }

            draw();
        }

        function countNeighbors(r, c) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = (r + dr + rows) % rows;
                    const nc = (c + dc + cols) % cols;
                    count += grid[nr][nc];
                }
            }
            return count;
        }

        function computeNext() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const n = countNeighbors(r, c);
                    if (grid[r][c]) {
                        nextGrid[r][c] = (n === 2 || n === 3) ? 1 : 0;
                    } else {
                        nextGrid[r][c] = (n === 3) ? 1 : 0;
                    }
                }
            }
            [grid, nextGrid] = [nextGrid, grid];
            generation++;
        }

        function draw() {
            ctx.fillStyle = '#0d0d22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#141430';
            ctx.lineWidth = 0.5;
            for (let c = 0; c <= cols; c++) {
                ctx.beginPath();
                ctx.moveTo(c * cellSize, 0);
                ctx.lineTo(c * cellSize, canvas.height);
                ctx.stroke();
            }
            for (let r = 0; r <= rows; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * cellSize);
                ctx.lineTo(canvas.width, r * cellSize);
                ctx.stroke();
            }

            // Draw cells
            let population = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c]) {
                        population++;
                        const x = c * cellSize;
                        const y = r * cellSize;

                        // Glow effect
                        ctx.shadowColor = '#00d4ff';
                        ctx.shadowBlur = cellSize > 6 ? 8 : 3;

                        const gradient = ctx.createRadialGradient(
                            x + cellSize / 2, y + cellSize / 2, 0,
                            x + cellSize / 2, y + cellSize / 2, cellSize * 0.7
                        );
                        gradient.addColorStop(0, '#4de8ff');
                        gradient.addColorStop(1, '#0099cc');

                        ctx.fillStyle = gradient;
                        const padding = cellSize > 6 ? 1 : 0.5;
                        const radius = cellSize > 6 ? 3 : 1;
                        roundRect(ctx, x + padding, y + padding, cellSize - padding * 2, cellSize - padding * 2, radius);
                        ctx.fill();

                        ctx.shadowBlur = 0;
                    }
                }
            }

            document.getElementById('generation').textContent = generation;
            document.getElementById('population').textContent = population;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function gameLoop(timestamp) {
            if (!playing) return;

            const fps = parseInt(document.getElementById('speedSlider').value);
            const interval = 1000 / fps;

            if (timestamp - lastFrameTime >= interval) {
                computeNext();
                draw();
                lastFrameTime = timestamp;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function togglePlay() {
            playing = !playing;
            const btn = document.getElementById('playBtn');
            if (playing) {
                btn.textContent = '⏸ Pause';
                btn.classList.add('active');
                lastFrameTime = performance.now();
                animationId = requestAnimationFrame(gameLoop);
            } else {
                btn.textContent = '▶ Play';
                btn.classList.remove('active');
                if (animationId) cancelAnimationFrame(animationId);
            }
        }

        function step() {
            computeNext();
            draw();
        }

        function clearGrid() {
            grid = Array.from({ length: rows }, () => new Uint8Array(cols));
            generation = 0;
            draw();
        }

        function randomize() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = Math.random() < 0.25 ? 1 : 0;
                }
            }
            generation = 0;
            draw();
        }

        function getCellFromMouse(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const c = Math.floor((e.clientX - rect.left) * scaleX / cellSize);
            const r = Math.floor((e.clientY - rect.top) * scaleY / cellSize);
            if (r >= 0 && r < rows && c >= 0 && c < cols) return { r, c };
            return null;
        }

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const cell = getCellFromMouse(e);
            if (!cell) return;
            isDrawing = true;
            drawValue = grid[cell.r][cell.c] ? 0 : 1;
            grid[cell.r][cell.c] = drawValue;
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const cell = getCellFromMouse(e);
            if (!cell) return;
            grid[cell.r][cell.c] = drawValue;
            draw();
        });

        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const cell = getCellFromMouse(touch);
            if (!cell) return;
            isDrawing = true;
            drawValue = grid[cell.r][cell.c] ? 0 : 1;
            grid[cell.r][cell.c] = drawValue;
            draw();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            const cell = getCellFromMouse(touch);
            if (!cell) return;
            grid[cell.r][cell.c] = drawValue;
            draw();
        }, { passive: false });

        window.addEventListener('touchend', () => { isDrawing = false; });

        document.getElementById('speedSlider').addEventListener('input', function () {
            document.getElementById('speedVal').textContent = this.value;
        });

        document.getElementById('sizeSlider').addEventListener('input', function () {
            cellSize = parseInt(this.value);
            document.getElementById('sizeVal').textContent = this.value;
            initCanvas();
        });

        // Patterns
        const patterns = {
            glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
            lwss: [[0,1],[0,4],[1,0],[2,0],[3,0],[3,4],[4,0],[4,1],[4,2],[4,3]],
            pulsar: (function() {
                const p = [];
                const offsets = [
                    [0,2],[0,3],[0,4],[0,8],[0,9],[0,10],
                    [2,0],[3,0],[4,0],[2,5],[3,5],[4,5],
                    [2,7],[3,7],[4,7],[2,12],[3,12],[4,12],
                    [5,2],[5,3],[5,4],[5,8],[5,9],[5,10]
                ];
                for (const [r,c] of offsets) {
                    p.push([r,c]);
                    p.push([12-r,c]);
                }
                return [...new Set(p.map(x=>x.join(',')))].map(s=>s.split(',').map(Number));
            })(),
            pentadecathlon: [[0,0],[1,0],[2,0],[3,1],[3,-1],[4,0],[5,0],[6,0],[7,0],[8,0],[9,1],[9,-1],[10,0],[11,0],[12,0]],
            gosperGun: [
                [0,24],[1,22],[1,24],[2,12],[2,13],[2,20],[2,21],[2,34],[2,35],
                [3,11],[3,15],[3,20],[3,21],[3,34],[3,35],[4,0],[4,1],[4,10],
                [4,16],[4,20],[4,21],[5,0],[5,1],[5,10],[5,14],[5,16],[5,17],
                [5,22],[5,24],[6,10],[6,16],[6,24],[7,11],[7,15],[8,12],[8,13]
            ],
            acorn: [[0,1],[1,3],[2,0],[2,1],[2,4],[2,5],[2,6]],
            rPentomino: [[0,1],[0,2],[1,0],[1,1],[2,1]]
        };

        function placePattern(name) {
            const pat = patterns[name];
            if (!pat) return;

            // Find bounding box center offset
            let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
            for (const [r,c] of pat) {
                minR = Math.min(minR, r); maxR = Math.max(maxR, r);
                minC = Math.min(minC, c); maxC = Math.max(maxC, c);
            }

            const offsetR = Math.floor(rows / 2) - Math.floor((maxR - minR) / 2);
            const offsetC = Math.floor(cols / 2) - Math.floor((maxC - minC) / 2);

            for (const [r, c] of pat) {
                const nr = r + offsetR;
                const nc = c + offsetC;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                    grid[nr][nc] = 1;
                }
            }

            draw();
        }

        // Init
        initCanvas();
        randomize();
    </script>
</body>
</html>
