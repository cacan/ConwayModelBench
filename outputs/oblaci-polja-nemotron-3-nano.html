<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400"
     viewBox="0 0 600 400"
     xmlns="http://www.w3.org/2000/svg"
     style="background:#cceeff">

  <!-- Oblačna pilja -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M100,150 Q150,120 200,150 Q250,180 300,150 Q350,120 400,150 Q450,180 500,150"/>
  </g>

  <!-- Sunce -->
  <g fill="#ffdd33">
    <circle cx="350" cy="80" r="40"/>
    <!-- svjetlosni zraci -->
    <g fill="#ffdd33">
      <rect x="335" y="30" width="10" height="30" transform="rotate(45,340,80)"/>
      <rect x="335" y="30" width="10" height="30" transform="rotate(-45,340,80)"/>
      <rect x="335" y="30" width="10" height="30" transform="rotate(135,340,80)"/>
      <rect x="335" y="30" width="10" height="30" transform="rotate(-135,340,80)"/>
    </g>
  </g>

  <!-- Planina (triangulacije) -->
  <polygon points="0,300 150,180 300,300" fill="#8b5a2b"/>
  <polygon points="300,300 450,200 600,300" fill="#8b5a2b"/>
  <polygon points="600,300 750,250 900,300" fill="#8b5a2b"/>

  <!-- Rijeka -->
  <path d="M0,350 Q150,330 300,350 T600,350 T900,350" 
        stroke="#4a90e2" stroke-width="12" fill="none" stroke-linecap="round"/>

</svg>
