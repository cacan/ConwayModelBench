<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberLife 3D // Enhanced</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1f2e;
            font-family: 'Rajdhani', sans-serif;
            color: white;
        }

        canvas { display: block; width: 100vw; height: 100vh; outline: none; }

        /* UI Overlay - HUD Style */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #00f3ff;
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.2);
            width: 280px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00f3ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            font-size: 0.9rem; 
            color: #a8b2c1; 
            margin-bottom: 5px; 
        }

        input[type="number"] {
            width: 60px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #4a5568;
            color: white;
            padding: 5px;
            border-radius: 4px;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }

        button {
            flex: 1;
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #00f3ff, #00a8b0);
            color: #050b14;
            font-weight: bold;
            transition: all 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.2); box-shadow: 0 5px 20px rgba(0, 243, 255, 0.4); }
        
        button.secondary { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; }
        button.danger { background: linear-gradient(135deg, #ff4b1f, #ff9068); color: white; }

        .stats {
            margin-top: 20px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .stat-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .val { color: #fff; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* Instructions overlay */
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0.8;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #a8b2c1;
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1f2e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
    </style>
    
    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading"><h2 style="color: #00f3ff; font-family: 'Orbitron';">LOADING...</h2></div>

    <div id="ui-layer">
        <h1>CYBERLIFE 3D</h1>
        
        <div class="control-group">
            <label>Grid Size (Rows x Cols)</label>
            <input type="number" id="inpRows" value="20" min="5" max="60"> 
            <span style="color:#aaa; margin: 0 5px;">x</span>
            <input type="number" id="inpCols" value="30" min="5" max="80">
        </div>

        <div class="control-group">
            <label>Simulation Speed (ms)</label>
            <input type="number" id="inpSpeed" value="100" min="10" max="1000">
        </div>

        <div class="btn-row">
            <button id="btnStart">START</button>
            <button class="secondary" id="btnRand">RANDOM</button>
        </div>
        <div class="btn-row">
             <button class="danger" style="flex:0.5" id="btnClear">CLEAR</button>
             <button class="secondary" style="flex:1.5" onclick="rebuildGrid()">REBUILD GRID</button>
        </div>

        <div class="stats">
            <div class="stat-item"><span>Generation:</span> <span id="dispGen" class="val">0</span></div>
            <div class="stat-item"><span>Population:</span> <span id="dispPop" class="val">0</span></div>
        </div>
    </div>

    <div id="instructions">
        LEFT CLICK: Rotate &bull; RIGHT CLICK: Pan &bull; SCROLL: Zoom &bull; CLICK CUBE: Toggle Life
    </div>

    <!-- Main Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        let rows = 20;
        let cols = 30;
        let speed = 100;
        let isRunning = false;
        let intervalId = null;
        let generation = 0;
        
        // Game State Array (2D)
        let gridData = [];

        // Three.js Globals
        let scene, camera, renderer, controls;
        let instancedMesh; 
        let glowMesh;
        const dummy = new THREE.Object3D(); // Helper for matrix calculations
        
        // Post-processing
        let composer;

        // Colors - More vibrant palette
        const colorDead = new THREE.Color(0x2d3748);
        const colorAlive1 = new THREE.Color(0x00f5ff);  // Cyan
        const colorAlive2 = new THREE.Color(0xbc13fe);  // Purple
        const colorAlive3 = new THREE.Color(0xff6b6b);  // Coral
        const colorHover = new THREE.Color(0xffffff);

        initThreeJS();
        
        window.addEventListener('load', () => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 500);
            rebuildGrid(); // Initial build
        });

        function initThreeJS() {
            // 1. Scene Setup - Lighter background with gradient feel
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1f2e);
            
            // Add subtle fog for depth
            scene.fog = new THREE.FogExp2(0x1a1f2e, 0.015);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(cols * 1.5, rows * 1.5, cols * 1.5);

            // 3. Renderer with better settings
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Post-processing (Bloom Effect)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, 0.4, 0.85 // Strength, radius, threshold
            );
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 5. Controls (Orbit)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 200;

            // 6. Enhanced Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(30, 60, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            
            // Add colored point lights for atmosphere
            const cyanPoint = new THREE.PointLight(0x00f5ff, 1.5, 50);
            cyanPoint.position.set(cols/2, rows/2 + 15, cols/2);
            scene.add(cyanPoint);

            const purplePoint = new THREE.PointLight(0xbc13fe, 1.0, 40);
            purplePoint.position.set(-cols/4, rows/4, -rows/4);
            scene.add(purplePoint);

            // Add a subtle grid helper on the floor
            const gridHelper = new THREE.GridHelper(200, 100, 0x3a4a6b, 0x252f42);
            gridHelper.position.y = -rows/2 - 2;
            scene.add(gridHelper);

            // Add some floating particles for atmosphere
            createParticles();

            // Animation Loop
            animate();
        }

        function createParticles() {
            const particleCount = 500;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            
            for(let i=0; i<particleCount; i++) {
                positions.push(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 80 + rows/2,
                    (Math.random() - 0.5) * 100
                );
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0x00f5ff,
                size: 0.15,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function rebuildGrid() {
            // Get inputs
            const rInput = document.getElementById('inpRows').value;
            const cInput = document.getElementById('inpCols').value;
            
            if(rInput > 0 && cInput > 0) {
                rows = parseInt(rInput);
                cols = parseInt(cInput);
            }

            // Stop simulation temporarily
            stopSimulation();

            // Clear old meshes
            if(instancedMesh) {
                scene.remove(instancedMesh);
                instancedMesh.geometry.dispose();
                instancedMesh.material.dispose();
            }
            if(glowMesh) {
                scene.remove(glowMesh);
                glowMesh.geometry.dispose();
                glowMesh.material.dispose();
            }

            // 1. Create Logic Grid (2D Array)
            gridData = [];
            for(let r=0; r<rows; r++) {
                let row = [];
                for(let c=0; c<cols; c++) {
                    row.push(0);
                }
                gridData.push(row);
            }

            // 2. Create Visual Grid (InstancedMesh) - Main cubes
            const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            
            // Enhanced material with better properties
            const material = new THREE.MeshStandardMaterial({ 
                color: colorDead,
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x000000,
                emissiveIntensity: 0
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, rows * cols);
            instancedMesh.castShadow = true;
            instancedMesh.receiveShadow = true;

            // 3. Create Glow Mesh (slightly larger transparent cubes for glow effect)
            const glowGeometry = new THREE.BoxGeometry(1.05, 1.05, 1.05);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f5ff,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            glowMesh = new THREE.InstancedMesh(glowGeometry, glowMaterial, rows * cols);

            let index = 0;
            const offsetX = (cols - 1) / 2;
            const offsetZ = (rows - 1) / 2;

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    dummy.position.set(c - offsetX, 0, r - offsetZ);
                    dummy.updateMatrix();
                    
                    instancedMesh.setMatrixAt(index, dummy.matrix);
                    glowMesh.setMatrixAt(index, dummy.matrix);
                    
                    // Initialize colors
                    instancedMesh.setColorAt(index, colorDead);
                    index++;
                }
            }

            scene.add(instancedMesh);
            scene.add(glowMesh);
            
            // Reset Camera slightly to fit new grid
            camera.position.set(cols * 1.2, rows * 1.5, cols * 1.2);
            controls.target.set(0,0,0);
            
            updateStats();
        }

        function randomize() {
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    gridData[r][c] = Math.random() > 0.7 ? 1 : 0;
                }
            }
            updateVisuals();
        }

        function clearGrid() {
            stopSimulation();
            generation = 0;
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    gridData[r][c] = 0;
                }
            }
            updateVisuals();
        }

        // --- Game Logic ---

        function nextGen() {
            let nextGrid = gridData.map(arr => [...arr]);
            let population = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const state = gridData[r][c];
                    const neighbors = countNeighbors(gridData, r, c);

                    if (state === 0 && neighbors === 3) nextGrid[r][c] = 1;
                    else if (state === 1 && (neighbors < 2 || neighbors > 3)) nextGrid[r][c] = 0;
                    else nextGrid[r][c] = state;

                    if(nextGrid[r][c] === 1) population++;
                }
            }

            gridData = nextGrid;
            generation++;
            updateVisuals();
            
            // Update DOM Stats
            document.getElementById('dispGen').innerText = generation;
            document.getElementById('dispPop').innerText = population;
        }

        function countNeighbors(grid, r, c) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    // Wrap around edges
                    let x = (r + i + rows) % rows;
                    let y = (c + j + cols) % cols;
                    sum += grid[x][y];
                }
            }
            sum -= grid[r][c]; 
            return sum;
        }

        // --- Rendering Updates with Color Variety ---

        function updateVisuals() {
            if(!instancedMesh || !glowMesh) return;

            let index = 0;
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    const state = gridData[r][c];
                    
                    if(state === 1) {
                        // Cycle through colors based on position for variety
                        const colorIndex = (r + c) % 3;
                        let aliveColor;
                        
                        switch(colorIndex) {
                            case 0: aliveColor = colorAlive1; break;
                            case 1: aliveColor = colorAlive2; break;
                            default: aliveColor = colorAlive3; break;
                        }
                        
                        instancedMesh.setColorAt(index, aliveColor);
                        glowMesh.setColorAt(index, aliveColor);
                    } else {
                        instancedMesh.setColorAt(index, colorDead);
                        // Make glow mesh invisible for dead cells
                        const transparentColor = new THREE.Color(0x000000);
                        transparentColor.setAlpha(0);
                        glowMesh.setColorAt(index, transparentColor);
                    }
                    
                    index++;
                }
            }
            
            instancedMesh.instanceColor.needsUpdate = true;
            glowMesh.instanceColor.needsUpdate = true;
        }

        function updateStats() {
             document.getElementById('dispGen').innerText = generation;
             let pop = 0;
             gridData.forEach(row => row.forEach(cell => pop += cell));
             document.getElementById('dispPop').innerText = pop;
        }

        // --- Interaction (Raycasting) ---

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', onMouseClick, false);

        function onMouseClick(event) {
            // Don't trigger if clicking UI
            if(event.target.closest('#ui-layer')) return;

            // Calculate mouse position in normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersect against the instanced mesh
            const intersects = raycaster.intersectObject(instancedMesh);

            if (intersects.length > 0) {
                const instanceId = intersects[0].instanceId;
                
                // Convert flat index back to r,c coordinates
                const c = instanceId % cols;
                const r = Math.floor(instanceId / cols);

                // Toggle state
                gridData[r][c] = gridData[r][c] ? 0 : 1;
                
                // Immediate visual update for clicked cell only (optimization)
                if(gridData[r][c] === 1) {
                    const colorIndex = (r + c) % 3;
                    let aliveColor;
                    switch(colorIndex) {
                        case 0: aliveColor = colorAlive1; break;
                        case 1: aliveColor = colorAlive2; break;
                        default: aliveColor = colorAlive3; break;
                    }
                    instancedMesh.setColorAt(instanceId, aliveColor);
                    glowMesh.setColorAt(instanceId, aliveColor);
                } else {
                    instancedMesh.setColorAt(instanceId, colorDead);
                    const transparentColor = new THREE.Color(0x000000);
                    transparentColor.setAlpha(0);
                    glowMesh.setColorAt(instanceId, transparentColor);
                }
                
                instancedMesh.instanceColor.needsUpdate = true;
                glowMesh.instanceColor.needsUpdate = true;
                
                updateStats();
            }
        }

        // --- Controls Logic ---

        function startSimulation() {
            if(isRunning) return;
            isRunning = true;
            document.getElementById('btnStart').innerText = "PAUSE";
            document.getElementById('btnStart').classList.add('danger');
            
            speed = parseInt(document.getElementById('inpSpeed').value);
            intervalId = setInterval(nextGen, speed);
        }

        function stopSimulation() {
            isRunning = false;
            clearInterval(intervalId);
            document.getElementById('btnStart').innerText = "START";
            document.getElementById('btnStart').classList.remove('danger');
        }

        // --- Event Listeners for UI ---

        document.getElementById('btnStart').addEventListener('click', () => {
            if(isRunning) stopSimulation(); else startSimulation();
        });

        document.getElementById('btnRand').addEventListener('click', randomize);
        document.getElementById('btnClear').addEventListener('click', clearGrid);

        // Handle Window Resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            if(composer) {
                composer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // --- Animation Loop with Effects ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            controls.update(); // Required for damping
            
            // Subtle floating animation for the whole grid group (optional aesthetic)
            if(instancedMesh && glowMesh) {
                instancedMesh.position.y = Math.sin(time * 0.5) * 0.3;
                glowMesh.position.y = Math.sin(time * 0.5) * 0.3;
                
                // Pulse effect for alive cells - subtle opacity change
                const pulse = (Math.sin(time * 2) + 1) / 2; // 0 to 1
                
                // Animate point lights
                scene.children.forEach(child => {
                    if(child.isPointLight) {
                        child.intensity = 1.0 + Math.sin(time + child.id) * 0.3;
                    }
                });
            }

            // Use composer for bloom effect instead of regular render
            if(composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        // Expose functions to window for HTML buttons
        window.rebuildGrid = rebuildGrid;
    </script>
</body>
</html>
