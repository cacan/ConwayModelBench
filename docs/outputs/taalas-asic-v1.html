<!DOCTYPE html>
<html>
<head>
  <title>Game of Life</title>
  <style>
    /* Add some basic styling to make the game look nice */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    #grid {
      display: grid;
      grid-template-columns: 10px 10px 10px 10px 10px 10px 10px 10px 10px 10px;
      grid-template-rows: 10px 10px 10px 10px 10px 10px 10px 10px 10px 10px;
      grid-gap: 1px;
      width: 100%;
      height: 100vh;
    }
    .cell {
      width: 10px;
      height: 10px;
      background-color: #fff;
      border: 1px solid #000;
    }
    .alive {
      background-color: #0f0;
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script>
    // Get the grid element
    const grid = document.getElementById('grid');

    // Define the grid size
    const gridSize = 50;

    // Create the grid
    for (let i = 0; i < gridSize; i++) {
      for (let j = 0; j < gridSize; j++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.style.gridArea = `${i * 10}px`;
        cell.style.gridRow = `${j * 10}px`;
        grid.appendChild(cell);
      }
    }

    // Define the rules of the game
    function applyRules(grid) {
      // Get the current state of the grid
      const cells = grid.children;
      for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
          // Get the current cell
          const cell = cells[i * gridSize + j];

          // Count the number of live neighbors
          let liveNeighbors = 0;
          for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
              // Skip the current cell
              if (x === 0 && y === 0) continue;

              // Check if the neighbor is alive
              const neighbor = cells[(i + x) * gridSize + (j + y)];
              if (neighbor.classList.contains('alive')) {
                liveNeighbors++;
              }
            }
          }

          // Apply the rules
          if (cell.classList.contains('alive')) {
            // If the cell is alive and has two or three live neighbors, it stays alive
            if (liveNeighbors === 2 || liveNeighbors === 3) {
              cell.classList.add('alive');
            } else {
              // If the cell is alive and has less than two live neighbors, it dies
              cell.classList.remove('alive');
            }
          } else {
            // If the cell is dead and has three live neighbors, it becomes alive
            if (liveNeighbors === 3) {
              cell.classList.add('alive');
            }
          }
        }
      }
    }

    // Start the game
    function startGame() {
      // Apply the rules 10 times
      for (let i = 0; i < 10; i++) {
        applyRules(grid);
        // Update the grid
        grid.innerHTML = '';
        for (let i = 0; i < gridSize; i++) {
          for (let j = 0; j < gridSize; j++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (grid.children[i * gridSize + j].classList.contains('alive')) {
              cell.classList.add('alive');
            }
            grid.appendChild(cell);
          }
        }
        // Pause for a bit
        setTimeout(() => {
          applyRules(grid);
          grid.innerHTML = '';
          for (let i = 0; i < gridSize; i++) {
            for (let j = 0; j < gridSize; j++) {
              const cell = document.createElement('div');
              cell.classList.add('cell');
              if (grid.children[i * gridSize + j].classList.contains('alive')) {
                cell.classList.add('alive');
              }
              grid.appendChild(cell);
            }
          }
        }, 100);
      }
    }

    // Start the game
    startGame();
  </script>
</body>
</html>
