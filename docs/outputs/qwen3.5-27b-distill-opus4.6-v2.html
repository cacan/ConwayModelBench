<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --grid-bg: #ecf0f1;
            --cell-alive: #27ae60;
            --cell-dead: #bdc3c7;
            --border-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
        }

        button:hover { background-color: #2980b9; }
        button.stop { background-color: #e74c3c; }
        button.stop:hover { background-color: #c0392b; }

        /* The Grid Container */
        .grid-container {
            display: grid;
            gap: 1px;
            background-color: var(--border-color);
            border: 5px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Individual Cells */
        .cell {
            width: 15px;
            height: 15px;
            background-color: var(--grid-bg);
            cursor: pointer;
        }

        .cell.alive {
            background-color: var(--cell-alive);
        }

        /* Instructions footer */
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>Conway's Game of Life</h1>

    <div class="controls">
        <button id="startBtn" onclick="toggleGame()">Start</button>
        <button onclick="randomizeGrid()">Randomize</button>
        <button onclick="clearGrid()">Clear</button>
    </div>

    <div id="grid" class="grid-container"></div>

    <div class="footer">Click cells to toggle them manually.</div>

    <script>
        // Configuration
        const rows = 30;
        const cols = 40;
        let grid = [];
        let isRunning = false;
        let intervalId = null;
        
        const gridElement = document.getElementById('grid');
        const startBtn = document.getElementById('startBtn');

        // Initialize the Grid
        function initGrid() {
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    // Create DOM element
                    const cellDiv = document.createElement('div');
                    cellDiv.classList.add('cell');
                    cellDiv.dataset.row = r;
                    cellDiv.dataset.col = c;
                    
                    // Add click event to toggle state manually
                    cellDiv.addEventListener('click', () => {
                        row[c] = row[c] ? 0 : 1;
                        updateCellVisual(cellDiv, row[c]);
                    });

                    gridElement.appendChild(cellDiv);
                    row.push(0); // 0 is dead, 1 is alive
                }
                grid.push(row);
            }
        }

        function updateCellVisual(element, state) {
            if (state === 1) element.classList.add('alive');
            else element.classList.remove('alive');
        }

        // Core Game Logic
        function nextGen() {
            let nextGrid = grid.map(arr => [...arr]); // Create a deep copy

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const state = grid[r][c];
                    const neighbors = countNeighbors(grid, r, c);

                    // Rules of Life
                    if (state === 0 && neighbors === 3) {
                        nextGrid[r][c] = 1; // Reproduction
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[r][c] = 0; // Underpopulation or Overpopulation
                    } else {
                        nextGrid[r][c] = state; // Stasis
                    }
                }
            }

            grid = nextGrid;
            draw();
        }

        function countNeighbors(grid, r, c) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    // Wrap around edges (Toroidal array) or check boundaries? 
                    // Here we wrap around:
                    let x = (r + i + rows) % rows;
                    let y = (c + j + cols) % cols;
                    
                    sum += grid[x][y];
                }
            }
            sum -= grid[r][c]; // Subtract self
            return sum;
        }

        function draw() {
            const cells = document.querySelectorAll('.cell');
            let index = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    updateCellVisual(cells[index], grid[r][c]);
                    index++;
                }
            }
        }

        // Controls
        function toggleGame() {
            if (isRunning) {
                clearInterval(intervalId);
                startBtn.textContent = "Start";
                startBtn.classList.remove('stop');
                isRunning = false;
            } else {
                intervalId = setInterval(nextGen, 100); // Speed: 100ms
                startBtn.textContent = "Stop";
                startBtn.classList.add('stop');
                isRunning = true;
            }
        }

        function randomizeGrid() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = Math.random() > 0.8 ? 1 : 0; // 20% chance of being alive
                }
            }
            draw();
        }

        function clearGrid() {
            if(isRunning) toggleGame();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = 0;
                }
            }
            draw();
        }

        // Start up
        initGrid();
        randomizeGrid(); // Start with a random pattern
        
    </script>
</body>
</html>
