<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life - Ultimate Edition</title>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(20, 20, 30, 0.4);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --accent-primary: #00f2ff; /* Cyan */
            --accent-secondary: #7000ff; /* Purple */
            --accent-glow: rgba(0, 242, 255, 0.4);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Subtle animated gradient background */
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 100%);
        }

        /* --- Header --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through to canvas */
        }

        .brand {
            pointer-events: auto;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .stats {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .stat-item span {
            color: var(--accent-primary);
            font-weight: bold;
        }

        /* --- Main Canvas --- */
        main {
            flex: 1;
            position: relative;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Glassmorphism Control Panel --- */
        .controls-wrapper {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            z-index: 20;
            pointer-events: none; /* Container is transparent */
        }

        .controls {
            pointer-events: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }

        /* Control Groups */
        .group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: linear-gradient(to bottom, transparent, var(--panel-border), transparent);
        }

        /* Buttons */
        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            outline: none;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        button.primary:hover {
            box-shadow: 0 0 30px var(--accent-glow);
            filter: brightness(1.1);
        }

        /* Select */
        select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 12px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover {
            border-color: var(--accent-primary);
        }

        /* Sliders */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 140px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent-primary);
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            top: 100px;
            right: 30px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        .toast.show {
            transform: translateX(0);
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
                border-radius: 20px;
                padding: 20px;
            }

            .group {
                justify-content: space-between;
            }

            .divider {
                display: none;
            }
            
            button {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Life Engine</h1>
        </div>
        <div class="stats">
            <div class="stat-item">GEN: <span id="gen-count">0</span></div>
            <div class="stat-item">POP: <span id="pop-count">0</span></div>
        </div>
    </header>

    <main id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </main>

    <div class="controls-wrapper">
        <div class="controls">
            <div class="group">
                <button id="btn-toggle" class="primary">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
                    </svg>
                    Start
                </button>
                <button id="btn-step">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8z"/>
                    </svg>
                    Step
                </button>
            </div>

            <div class="divider"></div>

            <div class="group">
                <select id="pattern-select">
                    <option value="" disabled selected>Load Pattern</option>
                    <option value="random">Randomize</option>
                    <option value="glider">Glider</option>
                    <option value="lwss">Lightweight Spaceship</option>
                    <option value="pulsar">Pulsar</option>
                    <option value="gosper">Gosper Gun</option>
                </select>
            </div>

            <div class="divider"></div>

            <div class="group">
                <button id="btn-clear" class="danger" style="color: #ff4757; border-color: rgba(255, 71, 87, 0.3);">
                    Clear
                </button>
            </div>

            <div class="divider"></div>

            <div class="group slider-container">
                <div class="slider-header">
                    <span>Speed</span>
                    <span id="speed-val">50ms</span>
                </div>
                <input type="range" id="speed-range" min="10" max="500" value="50" step="10">
            </div>
        </div>
    </div>

    <div id="toast" class="toast">System Ready</div>

    <script>
        /**
         * Game of Life - Ultimate Edition
         * Features: Motion Trails, Glassmorphism UI, Responsive Canvas
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        const container = document.getElementById('canvas-container');
        
        // UI Elements
        const btnToggle = document.getElementById('btn-toggle');
        const btnStep = document.getElementById('btn-step');
        const btnClear = document.getElementById('btn-clear');
        const patternSelect = document.getElementById('pattern-select');
        const speedRange = document.getElementById('speed-range');
        const speedVal = document.getElementById('speed-val');
        const genCountEl = document.getElementById('gen-count');
        const popCountEl = document.getElementById('pop-count');
        const toastEl = document.getElementById('toast');

        // Configuration
        let resolution = 12; // Cell size (slightly larger for better visuals)
        let cols, rows;
        let grid = [];
        let isRunning = false;
        let animationId;
        let generation = 0;
        let lastFrameTime = 0;
        let fpsInterval = 50; 
        
        // Interaction
        let isDrawing = false;
        let drawMode = 1; 

        // --- Initialization ---

        function init() {
            resizeCanvas();
            createGrid();
            randomizeGrid();
            draw();
            showToast("Welcome to Life Engine");
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            cols = Math.ceil(canvas.width / resolution);
            rows = Math.ceil(canvas.height / resolution);
            
            // Preserve data if possible, otherwise reset
            if (grid.length === 0 || grid.length !== cols || grid[0].length !== rows) {
                createGrid();
            }
        }

        function createGrid() {
            grid = new Array(cols).fill(null).map(() => new Array(rows).fill(0));
            generation = 0;
            updateStats();
        }

        // --- Core Logic ---

        function computeNextGen() {
            let nextGrid = grid.map(arr => [...arr]);
            let hasChanges = false;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    let state = grid[i][j];
                    let neighbors = countNeighbors(grid, i, j);

                    if (state === 0 && neighbors === 3) {
                        nextGrid[i][j] = 1;
                        hasChanges = true;
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[i][j] = 0;
                        hasChanges = true;
                    } else {
                        nextGrid[i][j] = state;
                    }
                }
            }

            grid = nextGrid;
            if (hasChanges) {
                generation++;
                updateStats();
            }
        }

        function countNeighbors(grid, x, y) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[col][row];
                }
            }
            sum -= grid[x][y];
            return sum;
        }

        // --- Rendering (The "Wow" Factor) ---

        function draw() {
            // 1. Draw the "Trail" Effect
            // Instead of clearing the canvas completely, we draw a semi-transparent 
            // rectangle over the whole screen. This makes old cells fade out slowly.
            ctx.fillStyle = 'rgba(5, 5, 8, 0.25)'; // The alpha controls trail length
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Living Cells
            // We use a gradient for a glowing effect
            const gradient = ctx.createRadialGradient(
                resolution/2, resolution/2, 0,
                resolution/2, resolution/2, resolution
            );
            gradient.addColorStop(0, '#ffffff'); // White core
            gradient.addColorStop(0.4, '#00f2ff'); // Cyan body
            gradient.addColorStop(1, 'rgba(0, 242, 255, 0)'); // Transparent edge

            ctx.fillStyle = gradient;
            
            // Optional: Add a global glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2ff';

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (grid[i][j] === 1) {
                        // Draw slightly smaller than resolution to see the grid effect
                        ctx.fillRect(
                            i * resolution + 1, 
                            j * resolution + 1, 
                            resolution - 2, 
                            resolution - 2
                        );
                    }
                }
            }
            
            ctx.shadowBlur = 0; // Reset for performance
        }

        // --- Game Loop ---

        function gameLoop(timestamp) {
            if (!isRunning) return;

            animationId = requestAnimationFrame(gameLoop);

            let elapsed = timestamp - lastFrameTime;

            if (elapsed > fpsInterval) {
                lastFrameTime = timestamp - (elapsed % fpsInterval);
                computeNextGen();
                draw();
            }
        }

        function togglePlay() {
            isRunning = !isRunning;
            if (isRunning) {
                btnToggle.innerHTML = `
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
                    </svg> Pause`;
                btnToggle.classList.remove('primary');
                lastFrameTime = performance.now();
                gameLoop(lastFrameTime);
                showToast("Simulation Running");
            } else {
                btnToggle.innerHTML = `
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/>
                    </svg> Start`;
                btnToggle.classList.add('primary');
                cancelAnimationFrame(animationId);
                showToast("Simulation Paused");
            }
        }

        // --- Interaction Handlers ---

        function updateStats() {
            genCountEl.textContent = generation;
            let pop = 0;
            for(let i=0; i<cols; i++) {
                for(let j=0; j<rows; j++) {
                    if(grid[i][j]) pop++;
                }
            }
            popCountEl.textContent = pop;
        }

        function getGridPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const x = evt.clientX - rect.left;
            const y = evt.clientY - rect.top;
            const i = Math.floor(x / resolution);
            const j = Math.floor(y / resolution);
            return { i, j };
        }

        function paintCell(evt) {
            const { i, j } = getGridPos(evt);
            if (i >= 0 && i < cols && j >= 0 && j < rows) {
                grid[i][j] = drawMode;
                draw(); // Immediate feedback
                updateStats();
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const { i, j } = getGridPos(e);
            if (i >= 0 && i < cols && j >= 0 && j < rows) {
                drawMode = grid[i][j] ? 0 : 1;
                paintCell(e);
            }
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) paintCell(e);
        });

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDrawing) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY });
                canvas.dispatchEvent(mouseEvent);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDrawing = false);

        // --- Controls Logic ---

        btnToggle.addEventListener('click', togglePlay);

        btnStep.addEventListener('click', () => {
            if (isRunning) togglePlay();
            computeNextGen();
            draw();
            updateStats();
        });

        btnClear.addEventListener('click', () => {
            if (isRunning) togglePlay();
            createGrid();
            draw();
            showToast("Grid Cleared");
        });

        patternSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'random') {
                randomizeGrid();
                showToast("Randomized");
            } else {
                loadPattern(val);
            }
            e.target.value = "";
        });

        speedRange.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            fpsInterval = 510 - val; 
            speedVal.textContent = val + "ms";
        });

        // --- Helpers ---

        function randomizeGrid() {
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    grid[i][j] = Math.random() > 0.85 ? 1 : 0;
                }
            }
            generation = 0;
            draw();
            updateStats();
        }

        function loadPattern(type) {
            const cx = Math.floor(cols / 2);
            const cy = Math.floor(rows / 2);

            const patterns = {
                'glider': [[0, -1], [1, 0], [-1, 1], [0, 1], [1, 1]],
                'lwss': [[-1, 0], [-1, 3], [0, -1], [1, -1], [2, -1], [3, -1], [3, 0], [3, 1], [3, 2], [2, 3], [1, 3], [0, 3]],
                'pulsar': generatePulsar(cx, cy),
                'gosper': generateGosper(cx, cy)
            };

            if (patterns[type]) {
                grid = new Array(cols).fill(null).map(() => new Array(rows).fill(0));
                patterns[type].forEach(([x, y]) => {
                    if (cx + x >= 0 && cx + x < cols && cy + y >= 0 && cy + y < rows) {
                        grid[cx + x][cy + y] = 1;
                    }
                });
                draw();
                updateStats();
                showToast(`Loaded ${type}`);
            }
        }

        function generatePulsar(cx, cy) {
            let p = [];
            for(let i=-4; i<=4; i++) {
                p.push([i, -6], [i, -5], [i, 5], [i, 6]);
                p.push([-6, i], [-5, i], [5, i], [6, i]);
            }
            return p;
        }

        function generateGosper(cx, cy) {
            let g = [
                [24,0], [22,1], [24,1], [12,2], [13,2], [20,2], [21,2], [34,2], [35,2], [11,3], [15,3], [20,3], [21,3], [34,3], [35,3],
                [0,4], [1,4], [10,4], [16,4], [20,4], [21,4], [0,5], [1,5], [10,5], [14,5], [16,5], [17,5], [22,5], [24,5],
                [10,6], [16,6], [24,6], [11,7], [15,7], [12,8], [13,8]
            ];
            return g;
        }

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2000);
        }

        // Window Resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                resizeCanvas();
                draw();
            }, 200);
        });

        // Start
        init();

    </script>
</body>
</html>
