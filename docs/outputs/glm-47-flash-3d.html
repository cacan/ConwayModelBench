<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neon Game of Life</title>
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg: #050510;
            --panel-bg: rgba(20, 20, 35, 0.7);
            --text: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        /* 3D Canvas Container */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        /* Controls Grid */
        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #aaa;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: linear-gradient(135deg, var(--primary), #00a8ff);
            color: #000;
            border: none;
        }

        button.danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
        }

        /* Sliders */
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Instructions */
        .instructions {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        /* Loading Overlay */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--primary);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
    <!-- Import Three.js and OrbitControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader"><div class="spinner"></div></div>

    <!-- UI Panel -->
    <div id="ui-layer">
        <h1>Life Engine 3D</h1>
        
        <div class="btn-row">
            <button id="btn-play" class="primary">Play</button>
            <button id="btn-step">Step</button>
        </div>
        
        <div class="btn-row">
            <button id="btn-random">Random</button>
            <button id="btn-clear" class="danger">Clear</button>
        </div>

        <div class="control-group">
            <label for="speed-slider">Speed: <span id="speed-val">30</span> FPS</label>
            <input type="range" id="speed-slider" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <label for="size-slider">Grid Size: <span id="size-val">40</span></label>
            <input type="range" id="size-slider" min="20" max="80" value="40">
        </div>

        <div class="instructions">
            <p>Left Click + Drag to Draw Cells</p>
            <p>Right Click + Drag to Rotate Camera</p>
            <p>Scroll to Zoom</p>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            gridSize: 40, // N x N grid
            cellSize: 1,
            gap: 0.1,
            colors: {
                dead: 0x111111,
                alive: 0x00f3ff,
                grid: 0x222222
            },
            speed: 30 // Frames per second target
        };

        // --- State ---
        let scene, camera, renderer, controls;
        let raycaster, mouse;
        let isPlaying = false;
        let lastFrameTime = 0;
        let animationId;
        
        // Game Logic Arrays
        let grid = []; // Current state
        let nextGrid = []; // Next state
        let meshes = []; // Three.js mesh references
        
        // Interaction State
        let isDrawing = false;
        let drawMode = 1; // 1 = add, 0 = remove

        // --- Initialization ---
        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.dead);
            scene.fog = new THREE.FogExp2(CONFIG.colors.dead, 0.035);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 40);
            camera.lookAt(0, 0, 0);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent going below ground

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(CONFIG.colors.alive, 2, 100);
            pointLight.position.set(10, 20, 10);
            scene.add(pointLight);

            // 6. Helpers
            // Create a base grid helper for visual reference
            const gridHelper = new THREE.GridHelper(CONFIG.gridSize * (CONFIG.cellSize + CONFIG.gap), CONFIG.gridSize, 0x444444, 0x222222);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            // 7. Raycaster for Interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 8. Initialize Grid
            createGrid();

            // 9. Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupUI();
            setupInteraction();

            // Remove Loader
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').remove(), 500);

            // Start Loop
            animate();
        }

        // --- Grid Logic ---
        function createGrid() {
            // Cleanup existing
            meshes.forEach(mesh => scene.remove(mesh));
            meshes = [];
            grid = [];
            nextGrid = [];

            const offset = (CONFIG.gridSize * (CONFIG.cellSize + CONFIG.gap)) / 2 - (CONFIG.cellSize + CONFIG.gap) / 2;

            // Geometry reuse for performance
            const geometry = new THREE.BoxGeometry(CONFIG.cellSize, CONFIG.cellSize, CONFIG.cellSize);
            // Shift geometry up so it sits on the grid plane
            geometry.translate(0, CONFIG.cellSize / 2, 0); 

            const material = new THREE.MeshStandardMaterial({
                color: 0x000000,
                emissive: CONFIG.colors.alive,
                emissiveIntensity: 2,
                roughness: 0.2,
                metalness: 0.8
            });

            for (let x = 0; x < CONFIG.gridSize; x++) {
                grid[x] = [];
                nextGrid[x] = [];
                meshes[x] = [];
                for (let z = 0; z < CONFIG.gridSize; z++) {
                    // Initialize empty
                    grid[x][z] = 0;
                    nextGrid[x][z] = 0;

                    // Create Mesh
                    const mesh = new THREE.Mesh(geometry, material.clone());
                    
                    // Position
                    mesh.position.x = x * (CONFIG.cellSize + CONFIG.gap) - offset;
                    mesh.position.z = z * (CONFIG.cellSize + CONFIG.gap) - offset;
                    mesh.position.y = 0;
                    
                    // Initial visibility
                    mesh.visible = false;
                    
                    scene.add(mesh);
                    meshes[x][z] = mesh;
                }
            }
        }

        function randomizeGrid() {
            for (let x = 0; x < CONFIG.gridSize; x++) {
                for (let z = 0; z < CONFIG.gridSize; z++) {
                    const alive = Math.random() > 0.85 ? 1 : 0; // 15% chance to be alive
                    grid[x][z] = alive;
                    updateMeshVisual(x, z, alive);
                }
            }
        }

        function clearGrid() {
            for (let x = 0; x < CONFIG.gridSize; x++) {
                for (let z = 0; z < CONFIG.gridSize; z++) {
                    grid[x][z] = 0;
                    updateMeshVisual(x, z, 0);
                }
            }
        }

        function updateMeshVisual(x, z, state) {
            const mesh = meshes[x][z];
            if (state === 1) {
                mesh.visible = true;
                mesh.material.emissive.setHex(CONFIG.colors.alive);
                // Add a slight random color variation for "wow" factor
                const hue = (Date.now() * 0.0001 + x * 0.01 + z * 0.01) % 1;
                mesh.material.color.setHSL(hue, 0.8, 0.5);
            } else {
                mesh.visible = false;
                mesh.material.emissive.setHex(0x000000);
            }
        }

        // --- Game of Life Logic ---
        function computeNextGeneration() {
            let hasChanges = false;

            for (let x = 0; x < CONFIG.gridSize; x++) {
                for (let z = 0; z < CONFIG.gridSize; z++) {
                    const neighbors = countNeighbors(x, z);
                    const currentState = grid[x][z];

                    // Rules
                    if (currentState === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[x][z] = 0; // Die
                        hasChanges = true;
                    } else if (currentState === 0 && neighbors === 3) {
                        nextGrid[x][z] = 1; // Born
                        hasChanges = true;
                    } else {
                        nextGrid[x][z] = currentState; // Stay
                    }
                }
            }

            // Swap arrays
            let temp = grid;
            grid = nextGrid;
            nextGrid = temp;

            // Update visuals
            for (let x = 0; x < CONFIG.gridSize; x++) {
                for (let z = 0; z < CONFIG.gridSize; z++) {
                    updateMeshVisual(x, z, grid[x][z]);
                }
            }
        }

        function countNeighbors(x, z) {
            let sum = 0;
            for (let i = -1; i < 2; i++) {
                for (let j = -1; j < 2; j++) {
                    // Wrap around logic (Toroidal surface)
                    let col = (x + i + CONFIG.gridSize) % CONFIG.gridSize;
                    let row = (z + j + CONFIG.gridSize) % CONFIG.gridSize;
                    sum += grid[col][row];
                }
            }
            sum -= grid[x][z]; // Subtract self
            return sum;
        }

        // --- Interaction ---
        function setupInteraction() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) { // Left click
                    isDrawing = true;
                    // Determine if we are adding or removing based on first click
                    updateCellUnderMouse();
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDrawing) {
                    updateCellUnderMouse();
                }
            });

            window.addEventListener('mouseup', () => {
                isDrawing = false;
            });
        }

        function updateCellUnderMouse() {
            // Calculate mouse position in normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Get all meshes
            const allMeshes = [];
            for(let x=0; x<CONFIG.gridSize; x++) {
                for(let z=0; z<CONFIG.gridSize; z++) {
                    allMeshes.push(meshes[x][z]);
                }
            }

            const intersects = raycaster.intersectObjects(allMeshes);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                // Find grid coordinates
                // We can approximate position or search, but since we know the grid structure,
                // we can calculate based on position relative to center.
                // However, a simple way is to iterate and check distance, or use the object reference.
                // Since we stored meshes in a 2D array, let's find the index.
                
                // Simple distance check to find which cell was clicked
                let found = false;
                for (let x = 0; x < CONFIG.gridSize; x++) {
                    for (let z = 0; z < CONFIG.gridSize; z++) {
                        if (meshes[x][z] === object) {
                            // Toggle state
                            const newState = drawMode; 
                            if (grid[x][z] !== newState) {
                                grid[x][z] = newState;
                                updateMeshVisual(x, z, newState);
                            }
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
            }
        }

        // --- UI Logic ---
        function setupUI() {
            const btnPlay = document.getElementById('btn-play');
            const btnStep = document.getElementById('btn-step');
            const btnRandom = document.getElementById('btn-random');
            const btnClear = document.getElementById('btn-clear');
            const speedSlider = document.getElementById('speed-slider');
            const sizeSlider = document.getElementById('size-slider');

            btnPlay.addEventListener('click', () => {
                isPlaying = !isPlaying;
                btnPlay.textContent = isPlaying ? "Pause" : "Play";
                btnPlay.classList.toggle('primary');
            });

            btnStep.addEventListener('click', () => {
                isPlaying = false;
                btnPlay.textContent = "Play";
                btnPlay.classList.add('primary');
                computeNextGeneration();
            });

            btnRandom.addEventListener('click', randomizeGrid);
            
            btnClear.addEventListener('click', () => {
                isPlaying = false;
                btnPlay.textContent = "Play";
                btnPlay.classList.add('primary');
                clearGrid();
            });

            speedSlider.addEventListener('input', (e) => {
                CONFIG.speed = parseInt(e.target.value);
                document.getElementById('speed-val').textContent = CONFIG.speed;
            });

            sizeSlider.addEventListener('change', (e) => {
                // Only update on release to avoid lag during drag
                const newSize = parseInt(e.target.value);
                document.getElementById('size-val').textContent = newSize;
                CONFIG.gridSize = newSize;
                createGrid();
                randomizeGrid();
            });
        }

        // --- Animation Loop ---
        function animate(time) {
            requestAnimationFrame(animate);

            // Calculate delta time for speed control
            const interval = 1000 / CONFIG.speed;
            if (time - lastFrameTime > interval) {
                if (isPlaying) {
                    computeNextGeneration();
                }
                lastFrameTime = time;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        init();
        randomizeGrid(); // Start with some life

    </script>
</body>
</html>
